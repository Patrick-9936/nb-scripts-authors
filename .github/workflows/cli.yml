name: CLI

# The CLI is distributed through GitHub releases, not a package registry.
# A tag like cli-v1.0.0 builds the single-file bundle and the tarball and
# attaches both to a release, so it can be installed with:
#   npm install -g https://github.com/.../releases/download/cli-v1.0.0/script-library-cli-1.0.0.tgz
# or run without installing anything:
#   node script-library.mjs list
on:
  push:
    paths: ['cli/**', '.github/workflows/cli.yml']
    tags: ['cli-v*']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests and bundle
        working-directory: cli
        run: npm test
      - name: The bundle runs on its own
        working-directory: cli
        run: |
          node dist/script-library.mjs --version
          node dist/script-library.mjs params --json > /dev/null
      - name: The package installs and runs
        working-directory: cli
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls script-library-cli-*.tgz)
          mkdir -p "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install --no-fund --no-audit "$GITHUB_WORKSPACE/cli/$tarball"
          ./node_modules/.bin/script-library --version
          ./node_modules/.bin/sl --version

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the tag matches the package version
        working-directory: cli
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "cli-v$version" != "$TAG" ]; then
            echo "::error::Тег $TAG не совпадает с версией $version в package.json"
            exit 1
          fi
      - name: Build the bundle and the tarball
        working-directory: cli
        run: |
          set -euo pipefail
          npm run bundle
          npm pack
          cp dist/script-library.mjs "$RUNNER_TEMP/script-library.mjs"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="cli/RELEASE-NOTES.md"
          tarball=$(ls cli/script-library-cli-*.tgz)
          if [ -f "$notes" ]; then
            gh release create "$TAG" "$tarball" "$RUNNER_TEMP/script-library.mjs" \
              --verify-tag --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$tarball" "$RUNNER_TEMP/script-library.mjs" \
              --verify-tag --title "$TAG" --generate-notes
          fi
